                  expirationSeconds: 600
                  path: token
        - name: secret-broker-ca
          configMap:
            name: clawmanager-secret-broker-ca
            optional: false
        - name: tls-cert
          secret:
            secretName: clawmanager-tls
            optional: true
        - name: northbound-core-tls
          secret:
            secretName: clawmanager-northbound-core-tls
        - name: northbound-gateway-client-ca
          secret:
            secretName: clawmanager-northbound-gateway-client-ca
        - name: workspaces
          persistentVolumeClaim:
            claimName: clawmanager-workspaces
