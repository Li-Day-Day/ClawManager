---
# ClawManager application resources for the nine-node production cluster.
# Apply only after Longhorn and the longhorn StorageClass are Ready.
# Create clawmanager-secrets out of band before applying this file.
# ClawManager cluster install profile.
# Official validation target: Longhorn CSI example.
# This site uses longhorn for RWO data and nfs-static for RWX workspaces.
apiVersion: v1
kind: Namespace
metadata:
  name: clawmanager-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clawmanager-mysql-init
  namespace: clawmanager-system
data:
  # Generated from deployments/mysql/000_database.sql; run node scripts/system-backup-d-init-check.mjs --write
  # normalized-source-sha256: 39778bd5bf9c4319a855eb47cf6c6da7d8d3a2bb5137939fa902eeee155dd142
  000_database.sql: |
    -- Database bootstrap only. Tables and seed data belong to backend/internal/db/migrations.
    -- Core runs the embedded migration runner before serving requests.
    CREATE DATABASE IF NOT EXISTS clawmanager CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: clawmanager-system
  labels:
    clawmanager.io/data-class: durable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: clawmanager-system
  labels:
    clawmanager.io/data-class: durable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: clawmanager-system
  labels:
    clawmanager.io/data-class: durable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-static
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: clawmanager-workspaces
spec:
  capacity:
    storage: 8Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  mountOptions:
    - nfsvers=4.2
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 10.130.224.6
    path: /mnt/nfs6/sample/clawmanager/workspaces
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: clawmanager-workspaces
    namespace: clawmanager-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clawmanager-workspaces
  namespace: clawmanager-system
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Ti
  storageClassName: nfs-static
  volumeName: clawmanager-workspaces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: clawmanager-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: 10.130.15.40:5000/mysql:8.4.8
          imagePullPolicy: IfNotPresent
          args:
            - "--innodb-use-native-aio=0"
            - "--max-connections=800"
            - "--log-bin=binlog"
            - "--server-id=1"
            - "--gtid-mode=ON"
            - "--enforce-gtid-consistency=ON"
            - "--binlog-expire-logs-seconds=259200"
            - "--max-binlog-size=134217728"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: clawmanager
            - name: MYSQL_USER
              value: clawmanager
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: mysql-init
          configMap:
            name: clawmanager-mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: clawmanager-system
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: clawmanager-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: 10.130.15.40:5000/minio/minio:upstream-20260824-14cea493d9a3
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: minio-root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: clawmanager-system
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-team-redis
  namespace: clawmanager-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawmanager-team-redis
  template:
    metadata:
      labels:
        app: clawmanager-team-redis
    spec:
      containers:
        - name: redis
          image: 10.130.15.40:5000/redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: clawmanager-redis
  namespace: clawmanager-system
spec:
  selector:
    app: clawmanager-team-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: clawmanager-team-redis
  namespace: clawmanager-system
spec:
  selector:
    app: clawmanager-team-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawmanager-app
  namespace: clawmanager-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clawmanager-runtime-manager
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clawmanager-runtime-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clawmanager-runtime-manager
subjects:
  - kind: ServiceAccount
    name: clawmanager-app
    namespace: clawmanager-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawmanager-secret-broker
  namespace: clawmanager-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clawmanager-secret-broker
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clawmanager-secret-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clawmanager-secret-broker
subjects:
  - kind: ServiceAccount
    name: clawmanager-secret-broker
    namespace: clawmanager-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-secret-broker
  namespace: clawmanager-system
  annotations:
    clawmanager.io/secret-broker-read-allowlist-version: staging-2026-09-21
    clawmanager.io/secret-broker-read-allowlist-sha256: 57f8cc8e82e2f0a3d2ac893d792b49f1a4449e29100cfe25f16e6060d5a9428e
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clawmanager-secret-broker
  template:
    metadata:
      labels:
        app: clawmanager-secret-broker
    spec:
      serviceAccountName: clawmanager-secret-broker
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-broker
          image: 10.130.15.40:5000/clawmanager@sha256:0fe32d900babed48ea224a1043d140a28335db9220c108128b8fb2f47b8c34de
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/clawreef-secret-broker"]
          env:
            - name: CLAWMANAGER_SECRET_BROKER_PORT
              value: "9444"
            - name: K8S_NAMESPACE
              value: "clawmanager"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLAWMANAGER_SECRET_BROKER_APP_SERVICE_ACCOUNT
              value: "clawmanager-app"
            - name: CLAWMANAGER_SECRET_BROKER_AUDIENCE
              value: "clawmanager-secret-broker"
            - name: CLAWMANAGER_SECRET_BROKER_TLS_CERT_FILE
              value: "/var/run/secrets/clawmanager-secret-broker-tls/tls.crt"
            - name: CLAWMANAGER_SECRET_BROKER_TLS_KEY_FILE
              value: "/var/run/secrets/clawmanager-secret-broker-tls/tls.key"
            - name: CLAWMANAGER_SECRET_BROKER_READ_ALLOWLIST
              value: ""
          ports:
            - name: https
              containerPort: 9444
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: secret-broker-tls
              mountPath: /var/run/secrets/clawmanager-secret-broker-tls
              readOnly: true
      volumes:
        - name: secret-broker-tls
          secret:
            secretName: clawmanager-secret-broker-tls
---
apiVersion: v1
kind: Service
metadata:
  name: clawmanager-secret-broker
  namespace: clawmanager-system
spec:
  selector:
    app: clawmanager-secret-broker
  ports:
    - name: https
      port: 9444
      targetPort: https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clawmanager-secret-broker-ingress
  namespace: clawmanager-system
spec:
  podSelector:
    matchLabels:
      app: clawmanager-secret-broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: clawmanager-app
      ports:
        - protocol: TCP
          port: 9444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-scanner
  namespace: clawmanager-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-scanner
  template:
    metadata:
      labels:
        app: skill-scanner
    spec:
      containers:
        - name: skill-scanner
          image: 10.130.15.40:5000/skill-scanner:upstream-20260824-05dcd709f780
          imagePullPolicy: IfNotPresent
          command:
            - /opt/skill-scanner-venv/bin/skill-scanner-api
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: SKILL_SCANNER_LLM_API_KEY
              value: ""
            - name: SKILL_SCANNER_LLM_MODEL
              value: ""
            - name: SKILL_SCANNER_LLM_BASE_URL
              value: ""
            - name: SKILL_SCANNER_META_LLM_API_KEY
              value: ""
            - name: SKILL_SCANNER_META_LLM_MODEL
              value: ""
            - name: SKILL_SCANNER_META_LLM_BASE_URL
              value: ""
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: skill-scanner
  namespace: clawmanager-system
spec:
  selector:
    app: skill-scanner
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-app
  namespace: clawmanager-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clawmanager-app
  template:
    metadata:
      labels:
        app: clawmanager-app
    spec:
      serviceAccountName: clawmanager-app
      initContainers:
        - name: wait-secret-broker
          image: 10.130.15.40:5000/clawmanager@sha256:0fe32d900babed48ea224a1043d140a28335db9220c108128b8fb2f47b8c34de
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              until openssl s_client \
                -connect clawmanager-secret-broker.clawmanager-system.svc.cluster.local:9444 \
                -servername clawmanager-secret-broker.clawmanager-system.svc.cluster.local \
                -verify_hostname clawmanager-secret-broker.clawmanager-system.svc.cluster.local \
                -verify_return_error \
                -CAfile /var/run/secrets/clawmanager-secret-broker-ca/ca.crt \
                </dev/null >/dev/null 2>&1; do
                sleep 2
              done
          volumeMounts:
            - name: secret-broker-ca
              mountPath: /var/run/secrets/clawmanager-secret-broker-ca
              readOnly: true
      containers:
        - name: clawmanager-app
          image: 10.130.15.40:5000/clawmanager@sha256:0fe32d900babed48ea224a1043d140a28335db9220c108128b8fb2f47b8c34de
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
            - name: proxy
              containerPort: 9001
            - name: northbound-core
              containerPort: 9002
          env:
            # Enable only with the matching upstream Hermes Lite runtime.
            - name: CLAWMANAGER_HERMES_DESKTOP_WEB_ENABLED
              value: "true"
            - name: HERMES_DEPLOYMENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLAWMANAGER_CONTROL_UI_ORIGIN
              value: "http://clawmanager-gateway.$(HERMES_DEPLOYMENT_NAMESPACE).svc.cluster.local:9001"
            - name: SERVER_ADDRESS
              value: ":9001"
            - name: SERVER_MODE
              value: "release"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "clawmanager"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: mysql-password
            - name: DB_NAME
              value: "clawmanager"
            - name: DB_MAX_OPEN_CONNS
              value: "150"
            - name: DB_MAX_IDLE_CONNS
              value: "50"
            - name: DB_CONN_MAX_LIFETIME
              value: "30m"
            - name: DB_CONN_MAX_IDLE_TIME
              value: "5m"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: jwt-secret
            - name: OBJECT_STORAGE_ENDPOINT
              value: "minio.clawmanager-system.svc.cluster.local:9000"
            - name: OBJECT_STORAGE_REGION
              value: ""
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: minio-access-key
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: minio-secret-key
            - name: OBJECT_STORAGE_BUCKET
              value: "clawmanager-skills"
            - name: OBJECT_STORAGE_USE_SSL
              value: "false"
            - name: OBJECT_STORAGE_BASE_PATH
              value: "skills"
            - name: OBJECT_STORAGE_FORCE_PATH_STYLE
              value: "true"
            - name: K8S_MODE
              value: "incluster"
            - name: K8S_NAMESPACE
              value: "clawmanager"
            - name: CLAWMANAGER_SECRET_BROKER_URL
              value: "https://clawmanager-secret-broker.clawmanager-system.svc.cluster.local:9444"
            - name: CLAWMANAGER_SECRET_BROKER_TOKEN_FILE
              value: "/var/run/secrets/clawmanager-secret-broker/token"
            - name: CLAWMANAGER_SECRET_BROKER_CA_FILE
              value: "/var/run/secrets/clawmanager-secret-broker-ca/ca.crt"
            - name: CLAWMANAGER_SECRET_BROKER_MIGRATION_COMPLETE
              value: "true"
            - name: K8S_STORAGE_CLASS
              value: "longhorn"
            - name: CLAWMANAGER_STORAGE_PROFILE
              value: "cluster"
            - name: K8S_HOSTPATH_FALLBACK_ENABLED
              value: "false"
            - name: K8S_PVC_BIND_TIMEOUT
              value: "2m"
            - name: K8S_CONTROL_PLANE_STORAGE_CLASS
              value: "longhorn"
            - name: K8S_INSTANCE_STORAGE_CLASS
              value: "longhorn"
            - name: K8S_WORKSPACE_STORAGE_CLASS
              value: "nfs-static"
            - name: K8S_WORKSPACE_ACCESS_MODE
              value: "ReadWriteMany"
            - name: CLAWMANAGER_WORKSPACE_ARCHIVE_MAX_MIB
              value: "500"
            - name: PLATFORM_REDIS_URL
              value: "redis://clawmanager-redis.clawmanager-system.svc.cluster.local:6379/0"
            - name: TEAM_REDIS_URL
              value: "redis://clawmanager-redis.clawmanager-system.svc.cluster.local:6379/0"
            - name: CLAWMANAGER_DESKTOP_DIRECT_PROXY
              value: "true"
            # Browser sessions, IEI owner sessions and dedicated Runtime
            # origins are all served over HTTPS.
            - name: IEISYSTEM_COOKIE_SECURE
              value: "true"
            - name: CLAWMANAGER_NORTHBOUND_ENABLED
              value: "true"
            - name: NORTHBOUND_CORE_INTERNAL_ADDRESS
              value: ":9002"
            - name: NORTHBOUND_INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clawmanager-northbound-secrets
                  key: internal-jwt-secret
            - name: IEISYSTEM_SSO_ENABLED
              value: "true"
            - name: IEISYSTEM_SSO_KEY
              valueFrom:
                secretKeyRef:
                  name: clawmanager-iei-sso
                  key: aes-key
            - name: IEISYSTEM_SSO_IV
              valueFrom:
                secretKeyRef:
                  name: clawmanager-iei-sso
                  key: aes-iv
            - name: IEISYSTEM_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: clawmanager-iei-sso
                  key: session-secret
            - name: IEISYSTEM_SSO_TOKEN_TTL
              value: "30s"
            - name: IEISYSTEM_SESSION_TTL
              value: "24h"
            - name: IEISYSTEM_SSO_TIMEZONE
              value: "Asia/Shanghai"
            - name: NORTHBOUND_CORE_TLS_CERT_FILE
              value: /etc/clawmanager/northbound/core/tls.crt
            - name: NORTHBOUND_CORE_TLS_KEY_FILE
              value: /etc/clawmanager/northbound/core/tls.key
            - name: NORTHBOUND_CORE_CLIENT_CA_FILE
              value: /etc/clawmanager/northbound/gateway-ca/ca.crt
            # Required for the OpenCode Lite root-origin UI. The {instance_id}
            # placeholder is required; see docs/deployment.md.
            - name: CLAWMANAGER_OPENCODE_PUBLIC_URL_TEMPLATE
              value: "https://opencode-{instance_id}.10-130-15-40.nip.io:30443/"
            # Required for the DeepSeek Harness Lite root-origin UI. The
            # {instance_id} placeholder is required; see docs/deployment.md.
            - name: CLAWMANAGER_DEEPSEEK_HARNESS_PUBLIC_URL_TEMPLATE
              value: "https://deepseek-harness-{instance_id}.10-130-15-40.nip.io:30443/"
            # Northbound callers continue to use the unified create endpoint;
            # the Core selects this managed Linux Pro image for WorkBuddy.
            - name: CLAWMANAGER_WORKBUDDY_LINUX_IMAGE
              value: "10.130.15.40:5000/agentsruntime/workbuddy-linux:2026.8.1"
            - name: CLAWMANAGER_TEAM_REDIS_URL
              value: "redis://clawmanager-redis.clawmanager-system.svc.cluster.local:6379/0"
            - name: CLAWMANAGER_TEAM_MANAGER_BASE_URL
              value: "http://clawmanager-gateway.clawmanager-system.svc.cluster.local:9001"
            - name: RUNTIME_NAMESPACE
              value: "clawmanager-system"
            - name: RUNTIME_WORKSPACE_ROOT
