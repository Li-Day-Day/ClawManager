            - name: SKILL_SCANNER_NAMESPACE
              value: "clawmanager-system"
            - name: SKILL_SCANNER_DEPLOYMENT
              value: "skill-scanner"
          volumeMounts:
            - name: secret-broker-token
              mountPath: /var/run/secrets/clawmanager-secret-broker
              readOnly: true
            - name: secret-broker-ca
              mountPath: /var/run/secrets/clawmanager-secret-broker-ca
              readOnly: true
            - name: tls-cert
              mountPath: /var/run/clawreef-tls
              readOnly: true
            - name: northbound-core-tls
              mountPath: /etc/clawmanager/northbound/core
              readOnly: true
            - name: northbound-gateway-client-ca
              mountPath: /etc/clawmanager/northbound/gateway-ca
              readOnly: true
            - name: workspaces
              mountPath: /workspaces
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: secret-broker-token
