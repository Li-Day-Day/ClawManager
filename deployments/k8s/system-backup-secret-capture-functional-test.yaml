# Functional-test-only Secret capture identity for the zhanghui08 test install.
# The Secret is deliberately empty; this manifest validates object-level RBAC
# without placing secret material in source control.
apiVersion: v1
kind: Secret
metadata:
  name: clawmanager-system-backup-functional-test-allowlisted
  namespace: clawmanager-zhanghui08-system
  labels:
    clawmanager.io/system-backup-purpose: functional-test
  annotations:
    clawmanager.io/secret-allowlist-version: functional-test-2026-09-20
    clawmanager.io/secret-allowlist-sha256: 4966a40bc8e3b948d29ac79cb3514a2955ec47a4186aa2eee14b07cbec4242b5
type: Opaque
immutable: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawmanager-system-backup-secret-capture
  namespace: clawmanager-zhanghui08-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clawmanager-system-backup-secret-capture-functional-test
  namespace: clawmanager-zhanghui08-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - clawmanager-system-backup-functional-test-allowlisted
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clawmanager-system-backup-secret-capture-functional-test
  namespace: clawmanager-zhanghui08-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clawmanager-system-backup-secret-capture-functional-test
subjects:
  - kind: ServiceAccount
    name: clawmanager-system-backup-secret-capture
    namespace: clawmanager-zhanghui08-system
