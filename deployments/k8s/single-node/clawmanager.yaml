---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clawmanager-runtime-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clawmanager-runtime-manager
subjects:
  - kind: ServiceAccount
    name: clawmanager-app
    namespace: clawmanager-system
---
# Namespace-local lease permissions are retained for installations that bind
# this Role independently of the cluster-wide runtime manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clawmanager-app-leaderelection
  namespace: clawmanager-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clawmanager-app-leaderelection
  namespace: clawmanager-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clawmanager-app-leaderelection
subjects:
  - kind: ServiceAccount
    name: clawmanager-app
    namespace: clawmanager-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawmanager-secret-broker
  namespace: clawmanager-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clawmanager-secret-broker
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clawmanager-secret-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clawmanager-secret-broker
subjects:
  - kind: ServiceAccount
    name: clawmanager-secret-broker
    namespace: clawmanager-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-secret-broker
  namespace: clawmanager-system
  annotations:
    clawmanager.io/secret-broker-read-allowlist-version: staging-2026-09-21
    clawmanager.io/secret-broker-read-allowlist-sha256: 57f8cc8e82e2f0a3d2ac893d792b49f1a4449e29100cfe25f16e6060d5a9428e
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clawmanager-secret-broker
  template:
    metadata:
      labels:
        app: clawmanager-secret-broker
    spec:
      serviceAccountName: clawmanager-secret-broker
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-broker
          image: ghcr.io/yuan-lab-llm/clawmanager:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/clawreef-secret-broker"]
          env:
            - name: CLAWMANAGER_SECRET_BROKER_PORT
              value: "9444"
            - name: K8S_NAMESPACE
              value: "clawmanager"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLAWMANAGER_SECRET_BROKER_APP_SERVICE_ACCOUNT
              value: "clawmanager-app"
            - name: CLAWMANAGER_SECRET_BROKER_AUDIENCE
              value: "clawmanager-secret-broker"
            - name: CLAWMANAGER_SECRET_BROKER_TLS_CERT_FILE
              value: "/var/run/secrets/clawmanager-secret-broker-tls/tls.crt"
            - name: CLAWMANAGER_SECRET_BROKER_TLS_KEY_FILE
              value: "/var/run/secrets/clawmanager-secret-broker-tls/tls.key"
            - name: CLAWMANAGER_SECRET_BROKER_READ_ALLOWLIST
              value: ""
          ports:
            - name: https
              containerPort: 9444
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: secret-broker-tls
              mountPath: /var/run/secrets/clawmanager-secret-broker-tls
              readOnly: true
      volumes:
        - name: secret-broker-tls
          secret:
            secretName: clawmanager-secret-broker-tls
---
apiVersion: v1
kind: Service
metadata:
  name: clawmanager-secret-broker
  namespace: clawmanager-system
spec:
  selector:
    app: clawmanager-secret-broker
  ports:
    - name: https
      port: 9444
      targetPort: https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clawmanager-secret-broker-ingress
  namespace: clawmanager-system
spec:
  podSelector:
    matchLabels:
      app: clawmanager-secret-broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: clawmanager-app
      ports:
        - protocol: TCP
          port: 9444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-scanner
  namespace: clawmanager-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-scanner
  template:
    metadata:
      labels:
        app: skill-scanner
    spec:
      containers:
