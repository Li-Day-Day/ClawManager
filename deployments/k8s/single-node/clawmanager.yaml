              value: ""
            - name: SKILL_SCANNER_LLM_MODEL
              value: ""
            - name: SKILL_SCANNER_LLM_BASE_URL
              value: ""
            - name: SKILL_SCANNER_META_LLM_API_KEY
              value: ""
            - name: SKILL_SCANNER_META_LLM_MODEL
              value: ""
            - name: SKILL_SCANNER_META_LLM_BASE_URL
              value: ""
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: skill-scanner
  namespace: clawmanager-system
spec:
  selector:
    app: skill-scanner
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-app
  namespace: clawmanager-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawmanager-app
  template:
    metadata:
      labels:
        app: clawmanager-app
    spec:
      serviceAccountName: clawmanager-app
      initContainers:
        - name: wait-secret-broker
          image: ghcr.io/yuan-lab-llm/clawmanager:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              until openssl s_client \
                -connect clawmanager-secret-broker.clawmanager-system.svc.cluster.local:9444 \
                -servername clawmanager-secret-broker.clawmanager-system.svc.cluster.local \
                -verify_hostname clawmanager-secret-broker.clawmanager-system.svc.cluster.local \
                -verify_return_error \
                -CAfile /var/run/secrets/clawmanager-secret-broker-ca/ca.crt \
                </dev/null >/dev/null 2>&1; do
                sleep 2
              done
          volumeMounts:
            - name: secret-broker-ca
              mountPath: /var/run/secrets/clawmanager-secret-broker-ca
              readOnly: true
      containers:
        - name: clawmanager-app
          image: ghcr.io/yuan-lab-llm/clawmanager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
            - name: proxy
              containerPort: 9001
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: SERVER_ADDRESS
              value: ":9001"
            - name: SERVER_MODE
              value: "release"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "clawmanager"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: mysql-password
            - name: DB_NAME
              value: "clawmanager"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: jwt-secret
            - name: AUTH_CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: auth-config-encryption-key
            - name: AUTH_ENTERPRISE_ENABLED
              value: "false"
            - name: AUTH_ENTERPRISE_ALLOW_LOCAL_FALLBACK
              value: "true"
            - name: AUTH_ENTERPRISE_SYNC_ROLE
              value: "false"
            - name: LDAP_HOST
              value: ""
            - name: LDAP_PORT
              value: "389"
            - name: LDAP_USE_TLS
              value: "false"
            - name: LDAP_START_TLS
              value: "false"
            - name: LDAP_SKIP_TLS_VERIFY
              value: "false"
            - name: LDAP_TLS_CA_FILE
              value: ""
            - name: LDAP_TLS_SERVER_NAME
              value: ""
            - name: LDAP_BIND_DN
              value: ""
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: ldap-bind-password
                  optional: true
            - name: LDAP_BASE_DN
              value: ""
            - name: LDAP_USER_FILTER
              value: "(&(objectClass=person)(uid=%s))"
            - name: LDAP_USERNAME_ATTRIBUTE
              value: "uid"
            - name: LDAP_EMAIL_ATTRIBUTE
              value: "mail"
            - name: LDAP_GROUP_BASE_DN
              value: ""
            - name: LDAP_GROUP_FILTER
              value: "(member=%s)"
            - name: LDAP_ADMIN_GROUP_DNS
              value: ""
            - name: LDAP_DEFAULT_ROLE
              value: "user"
            - name: OBJECT_STORAGE_ENDPOINT
              value: "minio.clawmanager-system.svc.cluster.local:9000"
            - name: OBJECT_STORAGE_REGION
              value: ""
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: minio-access-key
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: minio-secret-key
            - name: OBJECT_STORAGE_BUCKET
              value: "clawmanager-skills"
            - name: OBJECT_STORAGE_USE_SSL
              value: "false"
            - name: OBJECT_STORAGE_BASE_PATH
              value: "skills"
            - name: OBJECT_STORAGE_FORCE_PATH_STYLE
              value: "true"
            - name: K8S_MODE
              value: "incluster"
            - name: K8S_NAMESPACE
              value: "clawmanager"
            - name: CLAWMANAGER_SECRET_BROKER_URL
              value: "https://clawmanager-secret-broker.clawmanager-system.svc.cluster.local:9444"
            - name: CLAWMANAGER_SECRET_BROKER_TOKEN_FILE
              value: "/var/run/secrets/clawmanager-secret-broker/token"
            - name: CLAWMANAGER_SECRET_BROKER_CA_FILE
              value: "/var/run/secrets/clawmanager-secret-broker-ca/ca.crt"
            - name: CLAWMANAGER_SECRET_BROKER_MIGRATION_COMPLETE
              value: "true"
            - name: K8S_STORAGE_CLASS
              value: "manual"
            - name: CLAWMANAGER_STORAGE_PROFILE
              value: "single-node"
            - name: K8S_HOSTPATH_FALLBACK_ENABLED
              value: "true"
            - name: K8S_PVC_BIND_TIMEOUT
              value: "2m"
            - name: K8S_CONTROL_PLANE_STORAGE_CLASS
              value: "manual"
            - name: K8S_INSTANCE_STORAGE_CLASS
              value: "manual"
            - name: K8S_WORKSPACE_STORAGE_CLASS
              value: "manual"
            - name: K8S_WORKSPACE_ACCESS_MODE
              value: "ReadWriteMany"
            - name: K8S_PV_HOST_PATH_PREFIX
              value: "/data/clawreef"
            - name: CLAWMANAGER_WORKSPACE_ARCHIVE_MAX_MIB
              value: "500"
            - name: PLATFORM_REDIS_URL
              value: "redis://clawmanager-redis.clawmanager-system.svc.cluster.local:6379/0"
            - name: TEAM_REDIS_URL
              value: "redis://clawmanager-redis.clawmanager-system.svc.cluster.local:6379/0"
            - name: CLAWMANAGER_HERMES_DESKTOP_WEB_ENABLED
              value: "true"
            - name: CLAWMANAGER_CONTROL_UI_ORIGIN
              value: "http://clawmanager-gateway.clawmanager-system.svc.cluster.local:9001"
            - name: CLAWMANAGER_DESKTOP_DIRECT_PROXY
              value: "true"
            # Required for the OpenCode Lite root-origin UI. The {instance_id}
            # placeholder is required; see docs/deployment.md.
            - name: CLAWMANAGER_OPENCODE_PUBLIC_URL_TEMPLATE
              value: ""
            # Required for the DeepSeek Harness Lite root-origin UI. The
            # {instance_id} placeholder is required; see docs/deployment.md.
            - name: CLAWMANAGER_DEEPSEEK_HARNESS_PUBLIC_URL_TEMPLATE
              value: ""
            # Leader election for control-plane singleton background loops.
            # Required before scaling replicas > 1 so SyncService / Team event
            # consumers / stale-task monitor run on exactly one replica.
            - name: CLAWMANAGER_LEADER_ELECTION
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLAWMANAGER_TEAM_REDIS_URL
              value: "redis://clawmanager-redis.clawmanager-system.svc.cluster.local:6379/0"
            - name: CLAWMANAGER_TEAM_MANAGER_BASE_URL
              value: "http://clawmanager-gateway.clawmanager-system.svc.cluster.local:9001"
            - name: RUNTIME_NAMESPACE
              value: "clawmanager-system"
            - name: RUNTIME_WORKSPACE_ROOT
              value: "/workspaces"
            - name: RUNTIME_WORKSPACE_PVC_CLAIM
              value: "clawmanager-workspaces"
            - name: RUNTIME_MAX_GATEWAYS_PER_POD
              value: "100"
            - name: RUNTIME_GATEWAY_START_IN_FLIGHT_LIMIT
              value: "100"
            - name: RUNTIME_GATEWAY_PORT_START
              value: "20000"
            - name: RUNTIME_GATEWAY_PORT_END
              value: "20299"
            - name: RUNTIME_SCHEDULER_ENABLED
              value: "true"
            - name: RUNTIME_HEARTBEAT_TIMEOUT
              value: "10s"
            - name: RUNTIME_AGENT_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: runtime-agent-control-token
            - name: RUNTIME_AGENT_REPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: runtime-agent-report-token
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: openclaw-gateway-token
            - name: SKILL_SCANNER_ENABLED
              value: "true"
            - name: SKILL_SCANNER_BASE_URL
              value: "http://skill-scanner.clawmanager-system.svc.cluster.local:8000"
            - name: SKILL_SCANNER_TIMEOUT_SECONDS
              value: "120"
            - name: SKILL_SCANNER_NAMESPACE
              value: "clawmanager-system"
            - name: SKILL_SCANNER_DEPLOYMENT
              value: "skill-scanner"
          volumeMounts:
            - name: secret-broker-token
              mountPath: /var/run/secrets/clawmanager-secret-broker
              readOnly: true
            - name: secret-broker-ca
              mountPath: /var/run/secrets/clawmanager-secret-broker-ca
              readOnly: true
            - name: tls-cert
              mountPath: /var/run/clawreef-tls
              readOnly: true
            - name: workspaces
              mountPath: /workspaces
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: secret-broker-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: clawmanager-secret-broker
                  expirationSeconds: 600
                  path: token
        - name: secret-broker-ca
          configMap:
            name: clawmanager-secret-broker-ca
            optional: false
        - name: tls-cert
          secret:
            secretName: clawmanager-tls
            optional: true
        - name: workspaces
          persistentVolumeClaim:
            claimName: clawmanager-workspaces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-runtime
  namespace: clawmanager-system
  labels:
    app: openclaw-runtime
    clawmanager.io/runtime-type: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-runtime
      clawmanager.io/runtime-type: openclaw
  template:
    metadata:
      labels:
        app: openclaw-runtime
        clawmanager.io/runtime-type: openclaw
    spec:
      containers:
        - name: runtime
          image: ghcr.io/yuan-lab-llm/agentsruntime/openclaw-lite:latest
          imagePullPolicy: Always
          env:
            - name: CLAWMANAGER_RUNTIME_TYPE
              value: openclaw
            - name: CLAWMANAGER_BACKEND_URL
              value: "http://clawmanager-gateway.clawmanager-system.svc.cluster.local:9001"
            - name: CLAWMANAGER_RUNTIME_DEPLOYMENT_NAME
              value: openclaw-runtime
            - name: CLAWMANAGER_RUNTIME_IMAGE_REF
              value: ghcr.io/yuan-lab-llm/agentsruntime/openclaw-lite:latest
            - name: RUNTIME_WORKSPACE_ROOT
              value: /workspaces
            - name: RUNTIME_GATEWAY_PORT_START
              value: "20000"
            - name: RUNTIME_GATEWAY_PORT_END
              value: "20299"
            - name: RUNTIME_AGENT_LISTEN_ADDR
              value: "0.0.0.0:19090"
            - name: RUNTIME_AGENT_PUBLIC_PORT
              value: "19090"
            - name: RUNTIME_GATEWAY_COMMAND
              value: "/usr/local/bin/openclaw gateway run --allow-unconfigured --auth token --bind lan --force"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: openclaw-gateway-token
            - name: RUNTIME_AGENT_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: runtime-agent-control-token
            - name: RUNTIME_AGENT_REPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: runtime-agent-report-token
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: agent
              containerPort: 19090
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: clawmanager-workspaces
