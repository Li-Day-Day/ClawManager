name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - backup
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Unified v2 checks replace source pins for the retired unversioned controller.
      # Historical gate scripts and their scope are listed in the companion review.
      - name: Test K8s install fixtures offline
        working-directory: .
        run: python3 -B -m unittest discover -s scripts/ci -p test_k8s_smoke.py -v

      - name: Check unified migration catalog and draft classification
        working-directory: .
        run: |
          python3 -B scripts/backup-team-catalog.py --check
          python3 -B scripts/backup-team-catalog_test.py
          node scripts/system-backup-d-bootstrap-rules.mjs --check
          node scripts/system-backup-d-projection-rules.mjs --check

      - name: Check Skill Hub backup policy draft
        run: |
          node ../scripts/system-backup-skill-hub-policy.mjs --check
          node --test ../scripts/system-backup-skill-hub-policy.test.mjs

      - name: Check deployment initialization parity
        run: |
          node ../scripts/system-backup-d-init-check.mjs
          node ../scripts/system-backup-d-init-check.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test manual installation workflow boundaries
        run: node --test ../scripts/ci/k8s-install-workflow.test.mjs

      - name: Test public backup API and recovery display
        run: node --test src/services/systemBackupActions.test.mjs src/services/api.backup-auth.test.mjs src/pages/admin/backups/backupRecoveryNotice.test.mjs

      - name: Build frontend
        env:
          VITE_SYSTEM_BACKUP_LIVE_READ: '1'
        run: npm run build

      - name: Test Hermes iframe boundaries
        run: node --test src/lib/hermesDesktopFrame.test.mjs src/lib/browserWorkerAccess.test.mjs src/services/authService.test.mjs ../e2e/desktop-proxy-edge.test.mjs

  hermes-desktop:
    name: Hermes Desktop Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install renderer dependencies
        run: npm ci --prefix hermes-desktop-web --ignore-scripts

      - name: Build pinned Desktop renderer
        run: node hermes-desktop-web/scripts/build.mjs

      - name: Test browser bridge
        run: npm test --prefix hermes-desktop-web

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build backend
        run: go build ./...

      - name: Run backend tests
        run: go test ./...

  browser-worker:
    name: Browser Worker Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test authenticated CDP and GUI relay
        working-directory: deployments/browser-worker/cdp-proxy
        run: go test -race main.go main_test.go
      - uses: docker/setup-buildx-action@v3
      - name: Build visible browser
        uses: docker/build-push-action@v6
        with:
          context: deployments/browser-worker
          file: deployments/browser-worker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: browser-worker:ci
      - name: Build relay
        uses: docker/build-push-action@v6
        with:
          context: deployments/browser-worker
          file: deployments/browser-worker/Dockerfile.cdp-proxy
          platforms: linux/amd64
          push: false
          tags: browser-worker-relay:ci

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - hermes-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-platform application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          tags: clawmanager:ci
