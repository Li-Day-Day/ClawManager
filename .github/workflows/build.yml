name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check system backup schema inventory
        run: |
          node --test ../scripts/system-backup-schema-inventory.test.mjs
          node ../scripts/system-backup-schema-inventory.mjs --check

      - name: Check system backup draft contracts
        run: node ../scripts/system-backup-contract-check.mjs --check

      - name: Check Skill Hub backup policy draft
        run: |
          node ../scripts/system-backup-skill-hub-policy.mjs --check
          node --test ../scripts/system-backup-skill-hub-policy.test.mjs

      - name: Check D deployment init and Admin DTO wire parity
        run: |
          node ../scripts/system-backup-d-init-check.mjs
          node ../scripts/system-backup-d-dto-check.mjs
          node ../scripts/system-backup-d-init-check.test.mjs
          node ../scripts/system-backup-d-dto-check.test.mjs
          node ../scripts/system-backup-d-deployment.test.mjs
          node ../scripts/system-backup-d-capacity-deployment.test.mjs
          bash ../scripts/system-backup-controller-grant-drift-phase.test.sh

      - name: Check system backup metrics registry
        run: node ../scripts/system-backup-metrics-registry.mjs --check

      - name: Check system backup Prometheus rule candidates
        run: node ../scripts/system-backup-prometheus-rules.mjs --check

      - name: Test system backup contract gates
        run: node --test ../scripts/system-backup-contract-check.test.mjs ../scripts/system-backup-contract-artifacts.test.mjs ../scripts/system-backup-producer-contract.test.mjs ../scripts/system-backup-schema-hash.test.mjs ../scripts/system-backup-prometheus-rules.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test Hermes iframe boundaries
        run: node --test src/lib/hermesDesktopFrame.test.mjs src/lib/browserWorkerAccess.test.mjs src/services/authService.test.mjs ../e2e/desktop-proxy-edge.test.mjs

  hermes-desktop:
    name: Hermes Desktop Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install renderer dependencies
        run: npm ci --prefix hermes-desktop-web --ignore-scripts

      - name: Build pinned Desktop renderer
        run: node hermes-desktop-web/scripts/build.mjs

      - name: Test browser bridge
        run: npm test --prefix hermes-desktop-web

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build backend
        run: go build -o bin/server ./cmd/server

      - name: Run backend tests
        run: go test ./...

  browser-worker:
    name: Browser Worker Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test authenticated CDP and GUI relay
        working-directory: deployments/browser-worker/cdp-proxy
        run: go test -race main.go main_test.go
      - uses: docker/setup-buildx-action@v3
      - name: Build visible browser
        uses: docker/build-push-action@v6
        with:
          context: deployments/browser-worker
          file: deployments/browser-worker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: browser-worker:ci
      - name: Build relay
        uses: docker/build-push-action@v6
        with:
          context: deployments/browser-worker
          file: deployments/browser-worker/Dockerfile.cdp-proxy
          platforms: linux/amd64
          push: false
          tags: browser-worker-relay:ci

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - hermes-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-platform application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          tags: clawmanager:ci

  k8s-smoke:
    name: Kubernetes Deploy Smoke Test
    runs-on: ubuntu-latest
    env:
      # Reviewed, anonymously pullable registry/repository@sha256:<digest>.
      # Required repository variable; never fall back to an unavailable latest.
      K8S_SMOKE_MINIO_IMAGE: ${{ vars.K8S_SMOKE_MINIO_IMAGE }}
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test isolated install fixtures
        run: python3 -B -m unittest discover -s scripts/ci -p test_k8s_smoke.py -v

      - name: Validate required CI storage image
        run: python3 -B scripts/ci/prepare_k8s_smoke.py --validate-inputs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local application image
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA} --build-arg VCS_REF=${GITHUB_SHA} -t clawmanager:ci .

      - name: Create kind cluster
        id: kind
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: clawmanager-ci
          ignore_failed_clean: true

      - name: Load image into kind
        run: kind load docker-image clawmanager:ci --name clawmanager-ci

      - name: Prepare disposable kind install
        shell: bash
        run: |
          set -euo pipefail
          test "$(kubectl config current-context)" = kind-clawmanager-ci
          fixture_dir="$(mktemp -d "${RUNNER_TEMP}/clawmanager-ci.XXXXXX")"
          echo "SMOKE_FIXTURE_DIR=${fixture_dir}" >> "$GITHUB_ENV"
          python3 -B scripts/ci/prepare_k8s_smoke.py --output "${fixture_dir}/install.yaml"
          kubectl --context=kind-clawmanager-ci label node clawmanager-ci-control-plane clawmanager.io/storage-node=true --overwrite
          kubectl --context=kind-clawmanager-ci apply -f "${fixture_dir}/install.yaml"

      - name: Wait for Secret Broker deployment
        run: kubectl --context=kind-clawmanager-ci -n clawmanager-system rollout status deployment/clawmanager-secret-broker --timeout=300s

      - name: Wait for object storage deployment
        run: kubectl --context=kind-clawmanager-ci -n clawmanager-system rollout status deployment/minio --timeout=300s

      - name: Wait for MySQL deployment
        run: kubectl --context=kind-clawmanager-ci -n clawmanager-system rollout status deployment/mysql --timeout=300s

      - name: Start ClawManager after MySQL is ready
        run: kubectl --context=kind-clawmanager-ci -n clawmanager-system scale deployment/clawmanager-app --replicas=1

      - name: Wait for ClawManager deployment
        run: kubectl --context=kind-clawmanager-ci -n clawmanager-system rollout status deployment/clawmanager-app --timeout=300s

      - name: Show cluster status on failure
        if: failure() && steps.kind.outcome == 'success'
        run: |
          kubectl --context=kind-clawmanager-ci get pods -A || true
          kubectl --context=kind-clawmanager-ci get pvc -A || true
          kubectl --context=kind-clawmanager-ci get events -A --sort-by=.lastTimestamp || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system describe deployment mysql || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system describe deployment clawmanager-app || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system describe pod -l app=mysql || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system describe pod -l app=clawmanager-app || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system logs deployment/mysql --tail=200 || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system logs deployment/clawmanager-app --tail=200 || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system describe pod -l app=clawmanager-secret-broker || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system describe pod -l app=minio || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system logs deployment/clawmanager-secret-broker --all-containers --tail=200 || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system logs deployment/clawmanager-app -c wait-secret-broker --tail=200 || true
          kubectl --context=kind-clawmanager-ci -n clawmanager-system logs deployment/minio --tail=200 || true

      - name: Start port-forward
        run: |
          kubectl --context=kind-clawmanager-ci -n clawmanager-system port-forward svc/clawmanager-frontend 8443:443 > /tmp/clawmanager-port-forward.log 2>&1 &
          echo $! > /tmp/clawmanager-port-forward.pid
          sleep 10

      - name: Verify health endpoint
        run: curl --fail --insecure https://127.0.0.1:8443/healthz

      - name: Verify version endpoint
        run: curl --fail --insecure https://127.0.0.1:8443/api/v1/version | grep -F "ci-${GITHUB_SHA}"

      - name: Verify web page is reachable
        run: curl --fail --insecure https://127.0.0.1:8443/ | grep -i "<!doctype html>"

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f /tmp/clawmanager-port-forward.pid ]; then
            kill "$(cat /tmp/clawmanager-port-forward.pid)" || true
          fi

      - name: Remove disposable certificate manifest
        if: always()
        shell: bash
        run: |
          if [[ -n "${SMOKE_FIXTURE_DIR:-}" ]]; then
            case "$SMOKE_FIXTURE_DIR" in
              "$RUNNER_TEMP"/clawmanager-ci.*)
                rm -f -- "$SMOKE_FIXTURE_DIR/install.yaml"
                rmdir -- "$SMOKE_FIXTURE_DIR"
                ;;
              *) echo "Unexpected fixture path; refusing cleanup" >&2; exit 1 ;;
            esac
          fi
